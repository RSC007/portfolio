  <!-- Paint the saved theme's background before JS loads to avoid a white flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.style.background = t === "light" ? "#ffffff" : "#212121";
        document.documentElement.style.colorScheme = t;
      } catch (e) { }
    })();
  </script>
